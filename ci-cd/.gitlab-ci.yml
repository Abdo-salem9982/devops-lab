stages:
  - build
  - scan
  - push
  - update

variables:
  APP_NAME: "fullstack"
  NAMESPACE: "fullstack"
  REGISTRY: "registry.gitlab.com/abdosalem9982/fullstack-app"
  FRONTEND_IMAGE: "registry.gitlab.com/abdosalem9982/fullstack-app/frontend"
  BACKEND_IMAGE: "registry.gitlab.com/abdosalem9982/fullstack-app/backend"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

# ============================================
# STAGE 1: BUILD
# ============================================

build:frontend-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Building frontend Docker image..."
    - docker build -t "$FRONTEND_IMAGE:$IMAGE_TAG" -t "$FRONTEND_IMAGE:latest" ./frontend
    - echo "Saving frontend image as artifact..."
    - docker save "$FRONTEND_IMAGE:$IMAGE_TAG" -o frontend-image.tar
    - docker save "$FRONTEND_IMAGE:latest" -o frontend-image-latest.tar
    - echo "Frontend Docker image built successfully."
  artifacts:
    paths:
      - frontend-image.tar
      - frontend-image-latest.tar
    expire_in: 1 hour

build:backend-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Building backend Docker image..."
    - docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" -t "$BACKEND_IMAGE:latest" ./backend
    - echo "Saving backend image as artifact..."
    - docker save "$BACKEND_IMAGE:$IMAGE_TAG" -o backend-image.tar
    - docker save "$BACKEND_IMAGE:latest" -o backend-image-latest.tar
    - echo "Backend Docker image built successfully."
  artifacts:
    paths:
      - backend-image.tar
      - backend-image-latest.tar
    expire_in: 1 hour

# ============================================
# STAGE 2: SCAN
# ============================================

scan:frontend-image:
  stage: scan
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build:frontend-image
  script:
    - echo "Loading frontend image from artifact..."
    - docker load -i frontend-image.tar
    - docker load -i frontend-image-latest.tar
    - echo "Scanning frontend image for vulnerabilities..."
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress "$FRONTEND_IMAGE:$IMAGE_TAG" | tee trivy-frontend-report.txt
    - echo "Frontend security scan complete."
  artifacts:
    name: trivy-frontend-report
    paths:
      - trivy-frontend-report.txt
    expire_in: 30 days
    when: always
  allow_failure: true

scan:backend-image:
  stage: scan
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build:backend-image
  script:
    - echo "Loading backend image from artifact..."
    - docker load -i backend-image.tar
    - docker load -i backend-image-latest.tar
    - echo "Scanning backend image for vulnerabilities..."
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress "$BACKEND_IMAGE:$IMAGE_TAG" | tee trivy-backend-report.txt
    - echo "Backend security scan complete."
  artifacts:
    name: trivy-backend-report
    paths:
      - trivy-backend-report.txt
    expire_in: 30 days
    when: always
  allow_failure: true

scan:dockerfile:
  stage: scan
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Scanning Dockerfiles for misconfigurations..."
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" aquasec/trivy config --exit-code 0 --severity HIGH,CRITICAL --format table --output /workspace/trivy-config-report.txt /workspace
    - echo "Dockerfile scan complete."
  artifacts:
    name: trivy-config-report
    paths:
      - trivy-config-report.txt
    expire_in: 30 days
    when: always
  allow_failure: true

# ============================================
# STAGE 3: PUSH
# ============================================

push:frontend-to-registry:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build:frontend-image
  only:
    - main
    - master
  script:
    - echo "Loading frontend image from artifact..."
    - docker load -i frontend-image.tar
    - docker load -i frontend-image-latest.tar
    - echo "Logging into registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$FRONTEND_IMAGE:$IMAGE_TAG"
    - docker push "$FRONTEND_IMAGE:latest"
    - echo "Frontend image pushed successfully."

push:backend-to-registry:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build:backend-image
  only:
    - main
    - master
  script:
    - echo "Loading backend image from artifact..."
    - docker load -i backend-image.tar
    - docker load -i backend-image-latest.tar
    - echo "Logging into registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$BACKEND_IMAGE:$IMAGE_TAG"
    - docker push "$BACKEND_IMAGE:latest"
    - echo "Backend image pushed successfully."

# ============================================
# STAGE 4: UPDATE
# ============================================

update:deployments:
  stage: update
  image: alpine:latest
  needs:
    - build:frontend-image
    - build:backend-image
  only:
    - main
    - master
  before_script:
    - apk add --no-cache sed git
  script:
  - |
    set -e
    echo "Updating deployment manifests..."
    sed -i "s|image:.*|image: $FRONTEND_IMAGE:$IMAGE_TAG|g" fullstack/frontend/frontend-deployment.yaml
    sed -i "s|image:.*|image: $BACKEND_IMAGE:$IMAGE_TAG|g" fullstack/backend/backend-deployment.yaml
    git config --global user.email "gitlab-ci@gitlab.com"
    git config --global user.name "GitLab CI"
    git add fullstack/frontend/frontend-deployment.yaml fullstack/backend/backend-deployment.yaml
    if git diff --cached --quiet; then
      echo "No changes detected."
      exit 0
    fi
    git commit -m "CI: Update images to $IMAGE_TAG [skip ci]"
    git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/abdosalem9982/fullstack-app.git"
    git push origin HEAD:master
    echo "Deployment manifests updated successfully."
    echo "Backend deployment manifest updated successfully."