apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: fullstack
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
      - name: backend
        image: ghcr.io/abdo-salem9982/devops-lab/backend:5a4603866e60fc532b5c499106732a87b534c166
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: backend-configmap
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
